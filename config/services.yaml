# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  mailer_from_address: "%env(MAILER_FROM_ADDRESS)%"
  mailer_from_name: "%env(MAILER_FROM_NAME)%"

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      $mailerFromAddress: "%mailer_from_address%"
      $mailerFromName: "%mailer_from_name%"

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  # Audit Log Listener
  App\EventListener\AuditLogListener:
    tags:
      - { name: doctrine.event_listener, event: postPersist }
      - { name: doctrine.event_listener, event: preUpdate }
      - { name: doctrine.event_listener, event: preRemove }

  # API Client Configuration
  App\Service\Integration\MouserApiClient:
    arguments:
      $apiKey: '%env(MOUSER_API_KEY)%'

  App\Service\Integration\DigiKeyApiClient:
    arguments:
      $clientId: '%env(DIGIKEY_CLIENT_ID)%'
      $clientSecret: '%env(DIGIKEY_CLIENT_SECRET)%'

  App\Service\Integration\NexarApiClient:
    arguments:
      $clientId: '%env(NEXAR_CLIENT_ID)%'
      $clientSecret: '%env(NEXAR_CLIENT_SECRET)%'

  App\Service\GoogleSearchService:
    arguments:
      $apiKey: '%env(GOOGLE_API_KEY)%'
      $searchEngineId: '%env(GOOGLE_SEARCH_ENGINE_ID)%'

  App\Service\LlmEnrichmentService:
    arguments:
      $apiKey: '%env(default::OPENAI_API_KEY)%'

  App\Service\GeminiContactExtractorService:
    arguments:
      $geminiApiKey: '%env(GOOGLE_API_KEY)%'

  App\Service\AggressiveContactDiscoveryService: ~

  App\Service\WebCrawler\CompanyClassifierService:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Service\EmailTrackingSigner:
    arguments:
      $secret: '%kernel.secret%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
