# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  mailer_from_address: "%env(MAILER_FROM_ADDRESS)%"
  mailer_from_name: "%env(MAILER_FROM_NAME)%"
  admin_email: "%env(default::ADMIN_EMAIL)%"
  default_locale: "%env(default::DEFAULT_LOCALE)%"
  default_timezone: "%env(default::DEFAULT_TIMEZONE)%"
  # Signing key for public meeting booking/cancellation tokens.
  # Dev/test fall back to the known literal below (see when@dev/when@test);
  # prod resolves APP_BOOKING_SECRET with NO default so the container build
  # fails loudly if the env var is unset (see when@prod).
  app.booking_secret: "%env(default:app.booking_secret_default:APP_BOOKING_SECRET)%"

  # Public self-registration is OFF by default: this is an internal CRM, and
  # accounts must be created by an admin (or via a future invitation flow).
  # Set ALLOW_PUBLIC_REGISTRATION=1 only if open signup is deliberate policy.
  app.public_registration_fallback: '0'
  app.searxng_base_url_fallback: 'http://127.0.0.1:8888'
  app.public_registration_enabled: "%env(bool:default:app.public_registration_fallback:ALLOW_PUBLIC_REGISTRATION)%"
  app.resend_verification_enabled: true

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      $mailerFromAddress: "%mailer_from_address%"
      $mailerFromName: "%mailer_from_name%"
      $adminEmail: "%admin_email%"
      $defaultLocale: "%default_locale%"
      $publicRegistrationEnabled: "%app.public_registration_enabled%"
      $projectDir: "%kernel.project_dir%"
      $defaultTimezone: "%default_timezone%"
      $retryLimit: "%email_campaign_retry_limit%"

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  # Audit Log Listener
  App\EventListener\AuditLogListener:
    tags:
      - { name: doctrine.event_listener, event: postPersist }
      - { name: doctrine.event_listener, event: onFlush }
      - { name: doctrine.event_listener, event: postFlush }

  # API Client Configuration
  App\Command\MigrationsPreflightCommand:
    arguments:
      $dependencyFactory: '@doctrine.migrations.dependency_factory'

  # Production entry point: preflight → preserve → migrate → verify.
  # Same shape as MigrationsPreflightCommand: autoconfigured command with
  # only the DependencyFactory argument pinned.
  App\Command\SafeMigrateCommand:
    arguments:
      $dependencyFactory: '@doctrine.migrations.dependency_factory'

  App\Service\Integration\AlibabaApiClient:
    arguments:
      $proxyRotation: '@App\Service\ProxyRotationService'

  App\Service\Integration\MouserApiClient:
    arguments:
      $apiKey: '%env(MOUSER_API_KEY)%'

  App\Service\Integration\DigiKeyApiClient:
    arguments:
      $clientId: '%env(DIGIKEY_CLIENT_ID)%'
      $clientSecret: '%env(DIGIKEY_CLIENT_SECRET)%'

  App\Service\Integration\NexarApiClient:
    arguments:
      $clientId: '%env(NEXAR_CLIENT_ID)%'
      $clientSecret: '%env(NEXAR_CLIENT_SECRET)%'

  App\Service\GoogleSearchService:
    arguments:
      $apiKey: '%env(GOOGLE_API_KEY)%'
      $searchEngineId: '%env(GOOGLE_SEARCH_ENGINE_ID)%'

  # Search Provider — self-hosted SearXNG (FREE, unlimited, aggregates 9 engines)
  App\Service\WebCrawler\SearchProvider\SearchProviderInterface:
    alias: App\Service\WebCrawler\SearchProvider\LocalSearxngProvider

  App\Service\WebCrawler\CompanyClassifierService:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Service\WebCrawler\Rules\RuleEngine:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Command\GoldenDatasetRegressionCommand:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Command\QualityGateCommand:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Service\EmailTrackingSigner:
    arguments:
      $secret: '%kernel.secret%'

  # Humanizes untranslated translation keys: a missing key such as
  # "quote.flash.created" renders as "Created" instead of the raw key.
  App\Translation\TranslatorDecorator:
    decorates: translator

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

when@dev:
  parameters:
    app.booking_secret_default: 'change-me-booking-secret'

  services:
    # ── Local dev overrides ──────────────────────────────────────────────────
    # SearXNG is not running locally. These configs force fallback to Google CSE.
    # Remove these blocks when SearXNG (port 8888) is running again.

    # GoogleDorkService: force null searchProvider → falls back to Google CSE
    App\Service\WebCrawler\GoogleDorkService:
      arguments:
        $httpClient: '@http_client'
        $logger: '@logger'
        $searchProvider: null

    # CompanyDiscoveryService: force null discoveryPipeline → falls back to GoogleDorkService
    App\Service\WebCrawler\CompanyDiscoveryService:
      arguments:
        $em: '@doctrine.orm.entity_manager'
        $companyRepo: '@App\Repository\CompanyRepository'
        $googleDork: '@App\Service\WebCrawler\GoogleDorkService'
        $logger: '@logger'
        $discoveryPipeline: null

when@test:
  parameters:
    app.booking_secret_default: 'change-me-booking-secret'

  services:
    # Tests exercise the real DI wiring (SearchProviderInterface → SearXNG).
    # GoogleDorkService falls back to Google CSE when SearXNG is unreachable,
    # so tests never depend on the port-8888 service being up.
    App\Service\WebCrawler\GoogleDorkService:
      arguments:
        $httpClient: '@http_client'
        $logger: '@logger'
        $searchProvider: '@App\Service\WebCrawler\SearchProvider\LocalSearxngProvider'

    App\Service\WebCrawler\CompanyDiscoveryService:
      arguments:
        $em: '@doctrine.orm.entity_manager'
        $companyRepo: '@App\Repository\CompanyRepository'
        $googleDork: '@App\Service\WebCrawler\GoogleDorkService'
        $logger: '@logger'
        $discoveryPipeline: null

when@prod:
  parameters:
    # No default: APP_BOOKING_SECRET must be set explicitly in production.
    # Container compilation fails with a clear "Environment variable not found"
    # error if it is missing, instead of silently signing tokens with a
    # known literal.
    app.booking_secret: "%env(APP_BOOKING_SECRET)%"
