doctrine:
  dbal:
    url: "%env(resolve:DATABASE_URL)%"
    profiling_collect_backtrace: "%kernel.debug%"
    use_savepoints: true
  orm:
    auto_generate_proxy_classes: true
    enable_lazy_ghost_objects: true
    report_fields_where_declared: true
    validate_xml_mapping: true
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    auto_mapping: true
    mappings:
      App:
        is_bundle: false
        dir: "%kernel.project_dir%/src/Entity"
        prefix: 'App\Entity'
        alias: App

when@test:
  doctrine:
    dbal:
      url: "%env(resolve:DATABASE_URL)%"
      use_savepoints: true
      logging: false
    orm:
      auto_generate_proxy_classes: true
      proxy_dir: "%kernel.cache_dir%/doctrine/orm/Proxies"
      second_level_cache:
        enabled: false
      # Cache drivers are intentionally NOT set here: config/packages/test/
      # (doctrine.yaml + framework.yaml) already wires array-backed pools
      # (doctrine.system_cache_pool / doctrine.result_cache_pool), and the
      # test/ directory is merged after this file, so any drivers declared
      # here would be dead config. Metadata/query/result caches are therefore
      # configured in exactly one place.

when@prod:
  doctrine:
    orm:
      auto_generate_proxy_classes: false
      proxy_dir: "%kernel.build_dir%/doctrine/orm/Proxies"
      query_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      result_cache_driver:
        type: pool
        pool: doctrine.result_cache_pool

  framework:
    cache:
      pools:
        doctrine.result_cache_pool:
          adapter: cache.app
        doctrine.system_cache_pool:
          adapter: cache.system
