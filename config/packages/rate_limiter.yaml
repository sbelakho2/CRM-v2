# Rate Limiter Configuration
# Protects sensitive endpoints from abuse
framework:
    rate_limiter:
        password_reset:
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'

        password_reset_ip:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

        registration:
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'

        registration_ip:
            policy: 'fixed_window'
            limit: 5
            interval: '1 hour'

        webhook_email:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'

        webhook_email_ip:
            policy: 'fixed_window'
            limit: 100
            interval: '1 minute'

        api_general:
            policy: 'token_bucket'
            limit: 100
            rate: { interval: '1 minute', amount: 60 }
