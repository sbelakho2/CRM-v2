framework:
  messenger:
    failure_transport: failed

    transports:
      async:
        dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
        retry_strategy:
          max_retries: 3
          delay: 1000
          multiplier: 2
      failed: "doctrine://default?queue_name=failed"
      sync: "sync://"
      mailer:
        dsn: "doctrine://default?queue_name=mailer"
        options:
          queue_name: mailer
        retry_strategy:
          max_retries: 3
          delay: 1000
          multiplier: 2

    routing:
      'Symfony\Component\Mailer\Messenger\SendEmailMessage': async
      'App\Message\EmailCampaignMessage': mailer

when@dev:
  framework:
    messenger:
      routing:
        # In dev, send emails synchronously for easier debugging
        'Symfony\Component\Mailer\Messenger\SendEmailMessage': sync

when@test:
  framework:
    messenger:
      routing:
        # In test, send emails synchronously
        'Symfony\Component\Mailer\Messenger\SendEmailMessage': sync
