framework:
  messenger:
    failure_transport: failed

    transports:
      async: "%env(MESSENGER_TRANSPORT_DSN)%"
      failed: "doctrine://default?queue_name=failed"
      sync: "sync://"
      mailer:
        dsn: "doctrine://default?queue_name=mailer"
        options:
          queue_name: mailer

    routing:
      # Send emails asynchronously to avoid blocking page loads
      # Requires running: bin/console messenger:consume async --time-limit=3600
      'Symfony\Component\Mailer\Messenger\SendEmailMessage': async
      'App\Message\EmailCampaignMessage': mailer

when@dev:
  framework:
    messenger:
      routing:
        # In dev, send emails synchronously for easier debugging
        'Symfony\Component\Mailer\Messenger\SendEmailMessage': sync

when@test:
  framework:
    messenger:
      routing:
        # In test, send emails synchronously
        'Symfony\Component\Mailer\Messenger\SendEmailMessage': sync
