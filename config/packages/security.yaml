security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"
    App\Entity\User:
      algorithm: auto

  providers:
    app_user_provider:
      id: App\Security\UserProvider

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    main:
      lazy: true
      provider: app_user_provider
      custom_authenticator: App\Security\LoginFormAuthenticator
      login_throttling:
        max_attempts: 5
        interval: '15 minutes'
      remember_me:
        secret: '%kernel.secret%'
        lifetime: 604800
        path: /
      logout:
        path: app_logout
        target: app_login

  access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/register, roles: PUBLIC_ACCESS }
    - { path: ^/verify-email, roles: PUBLIC_ACCESS }
    - { path: ^/email/unsubscribe, roles: PUBLIC_ACCESS }
    - { path: ^/logout, roles: PUBLIC_ACCESS }
    - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
    - { path: ^/reset-password, roles: PUBLIC_ACCESS }
    - { path: ^/email-campaigns/track, roles: PUBLIC_ACCESS }
    - { path: ^/webhook/email, roles: PUBLIC_ACCESS }
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/quote-copilot, roles: [ROLE_USER, ROLE_ENGINEERING] }
    - { path: ^/quote-review, roles: [ROLE_USER, ROLE_ENGINEERING] }
    - { path: ^/reports, roles: [ROLE_USER, ROLE_ENGINEERING] }
    - { path: ^/compliance, roles: [ROLE_USER, ROLE_ENGINEERING] }
    - { path: ^/supplier-portal, roles: [ROLE_USER, ROLE_ENGINEERING] }
    - { path: ^/currency-converter, roles: [ROLE_USER, ROLE_ENGINEERING] }
    # Provider webhook callbacks authenticate via their own shared-secret
    # header (X-Webhook-Secret), so the firewall must not require a session.
    - { path: ^/api/autonomous/webhook, roles: PUBLIC_ACCESS }
    - { path: ^/api, roles: ROLE_USER }
    - { path: ^/, roles: ROLE_USER }

  role_hierarchy:
    ROLE_ADMIN: [ROLE_ENGINEERING, ROLE_MANAGER, ROLE_SALES, ROLE_SALES_OPS, ROLE_DIGITAL_REP, ROLE_FIELD_REP, ROLE_VIEWER, ROLE_USER]
    ROLE_ENGINEERING: [ROLE_MANAGER, ROLE_SALES, ROLE_SALES_OPS, ROLE_VIEWER, ROLE_USER]
    ROLE_MANAGER: [ROLE_SALES, ROLE_VIEWER, ROLE_USER]
    ROLE_SALES: [ROLE_VIEWER, ROLE_USER]
    ROLE_SALES_OPS: [ROLE_DIGITAL_REP, ROLE_FIELD_REP, ROLE_USER]
    ROLE_DIGITAL_REP: ROLE_USER
    ROLE_FIELD_REP: ROLE_USER
    ROLE_VIEWER: ROLE_USER

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
