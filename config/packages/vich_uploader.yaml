vich_uploader:
    db_driver: orm

    mappings:
        compliance_documents:
            uri_prefix: /uploads/compliance
            upload_destination: '%kernel.project_dir%/public/uploads/compliance'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_remove: true

        case_study_pdfs:
            uri_prefix: /uploads/case-studies
            upload_destination: '%kernel.project_dir%/public/uploads/case-studies'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_remove: true
