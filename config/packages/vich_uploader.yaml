vich_uploader:
    db_driver: orm
    
    # Metadata driver configuration
    metadata:
        type: attribute
    
    mappings:
        # Compliance documents (certifications, audits)
        compliance_documents:
            uri_prefix: /uploads/compliance
            upload_destination: '%kernel.project_dir%/public/uploads/compliance'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
            
        # General documents (quotes, estimates, reports)
        documents:
            uri_prefix: /uploads/documents
            upload_destination: '%kernel.project_dir%/public/uploads/documents'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
            
        # Case study PDFs
        case_study_pdfs:
            uri_prefix: /uploads/case-studies
            upload_destination: '%kernel.project_dir%/public/uploads/case-studies'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
            
        # BOM files (CSV, Excel uploads for Quote Co-Pilot)
        bom_files:
            uri_prefix: /uploads/bom
            upload_destination: '%kernel.project_dir%/public/uploads/bom'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
