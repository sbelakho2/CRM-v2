# ═══════════════════════════════════════════════════════════════════
# COMPETITOR SIGNALS — snippets indicating EMS/contract manufacturer
# ═══════════════════════════════════════════════════════════════════
competitor_patterns:
  - name: "ems_provider_language"
    pattern: '(leading|premier|trusted|reliable)\s+(ems|contract\s+manufactur|pcb\s+assembl)'
    action: "reject"
    weight: -50
    description: "Company provides EMS services (our competitor)"

  - name: "turnkey_ems"
    pattern: '(full[\s-]service|turnkey)\s+(ems|electronics|contract)'
    action: "reject"
    weight: -50
    description: "Full-service/turnkey EMS provider"

  - name: "pcb_assembly_provider"
    pattern: 'pcb\s+assembly\s+(service|capabilit|provider|company|house|partner)'
    action: "reject"
    weight: -50
    description: "PCB assembly service provider"

  - name: "cable_harness_mfg"
    pattern: 'cable\s+(harness|assembly)\s+(manufactur|provider|service|company|supplier)'
    action: "reject"
    weight: -50
    description: "Cable harness manufacturer"

  - name: "smt_assembly"
    pattern: 'smt\s+(assembly|line|process|manufactur)'
    action: "reject"
    weight: -45
    description: "SMT assembly provider"

  - name: "prototype_to_production"
    pattern: 'prototype\s+to\s+production'
    action: "reject"
    weight: -45
    description: "Prototype-to-production service"

  - name: "low_vol_high_mix"
    pattern: '(low[\s-]volume.*high[\s-]mix|high[\s-]mix.*low[\s-]volume)'
    action: "reject"
    weight: -45
    description: "Low-volume high-mix (EMS language)"

  - name: "we_manufacture_electronics"
    pattern: 'manufactur(e|ing|er)\s+of\s+(cable|wire|pcb|electronic)'
    action: "reject"
    weight: -50
    description: "Manufactures cables/PCBs/electronics"

# ═══════════════════════════════════════════════════════════════════
# WRONG-TYPE SIGNALS — not a buyer
# ═══════════════════════════════════════════════════════════════════
wrong_type_patterns:
  - name: "distributor"
    pattern: '(authorized\s+distribut|distribut(or|ion)\s+of\s+(electronic|component|semiconductor))'
    action: "reject"
    weight: -40
    description: "Electronic component distributor"

  - name: "government_body"
    pattern: '(government|authority|ministry|department\s+of|bureau\s+of|municipality)'
    action: "reject"
    weight: -50
    description: "Government body"

  - name: "academic_institution"
    pattern: '(university|universit[éèeäa]|college|school\s+of|institute\s+of|research\s+cent[er])'
    action: "reject"
    weight: -40
    description: "Academic/research institution"

  - name: "news_media"
    pattern: '(newspaper|news\s+agency|media\s+company|publishing|journalist|magazine|podcast|broadcast)'
    action: "reject"
    weight: -40
    description: "News/media outlet"

  - name: "financial_services"
    pattern: '(bank|banking|insurance|fintech|financial\s+services|credit\s+union|stock\s+exchange)'
