  - name: "gaming_studio"
    pattern: '(game\s+studio|video\s+game|game\s+develop|indie\s+game|gaming\s+(company|studio)|esports?)'
    action: "reject"
    weight: -40
    description: "Game studio"

# ═══════════════════════════════════════════════════════════════════
# JUNK NAME PATTERNS — company names that are not real companies
# ═══════════════════════════════════════════════════════════════════
junk_name_patterns:
  - '^\d+$'                              # Pure numbers
  - '^[a-z]{1,2}$'                       # Single/double letters
  - '^(home|contact|about|products?|services?|news|blog|careers?|login|search|faq|sitemap)$'
  - '(startseite|accueil|inicio|strona|pagina|página|главная|الرئيسية|ホーム)'
  - '(cookie|privacy|terms|legal|disclaimer|imprint|impressum)'
  - '^(top|best|leading|premier|list\s+of|directory)'
  - '(\.pdf|\.doc|\.xls|\.ppt)$'
  # Market report / research titles
  - '\bmarket\s+(20[2-4]\d|size|growth|report|forecast|analysis|outlook|share|trends?)'
  - '\b(CAGR|compound\s+annual|market\s+research)\b'
  - '\b(report|forecast|analysis)\s+20[2-4]\d'
  # Generic service/industry descriptions (not company names)
  - '^(contract|electronic|pcb|cable)\s+(manufactur|assembly|services?)'
  - '^conformal\s+coating'
  - '^(tax\s+credit|certifications?\s+(issued|for))'
  - '^free\s+(member|course|download|trial|sample)'
  # Product names / SKUs
  - '^[A-Z]{1,4}\d{3,}\b'               # SKU like WH08Z200, SJ100
  - '(silicone|acrylic|epoxy|urethane)\s+conformal\s+coating'
  - '\bstaticide\b'
  # Events / disasters / non-business
  - '\b(earthquake|flood|hurricane|tsunami|disaster)\s+(in|near)\b'
  - '\b(IoT|AI|robotics|3D\s+printing|web)\s+development\b'
  # Foreign-language long descriptions
  - '\b(maszyna|maschine|appareil|máquina)\s+'
  - '\b(messe|feira|feria|foire)\s+'

# ═══════════════════════════════════════════════════════════════════
# POSITIVE SIGNALS — evidence of being a real EMS buyer
# ═══════════════════════════════════════════════════════════════════
positive_patterns:
  - name: "product_design_language"
    pattern: '(we\s+design|we\s+develop|we\s+engineer|our\s+products?|product\s+line|product\s+range|product\s+portfolio)'
    weight: 20
    family: "PRODUCT_PORTFOLIO"

  - name: "specific_product_types"
    pattern: '(inverter|converter|controller|sensor|actuator|module|radar|lidar|avionics|telematics)'
    weight: 15
    family: "PRODUCT_PORTFOLIO"

  - name: "manufacturing_facility"
    pattern: '(factory|plant|production\s+line|production\s+facility|manufacturing\s+plant|assembly\s+plant)'
    weight: 10
    family: "MANUFACTURING_OEM"

  - name: "business_structure"
    pattern: '(headquarters|founded|established|since\s+\d{4}|employees|revenue|worldwide|subsidiaries)'
    weight: 10
    family: "ORG_FOOTPRINT"

  - name: "certifications"
    pattern: '(iso\s+9001|iatf\s+16949|as9100|iso\s+13485|iso\s+14001|nadcap|cmmi|ce\s+mark)'
    weight: 10
    family: "MANUFACTURING_OEM"

  - name: "supply_chain_procurement"
    pattern: '(supply\s+chain|procurement|outsourc|vendor|supplier\s+to|oem\s+partner|tier[\s-]?[12]\s+supplier)'
    weight: 10
    family: "BUYER_PROCUREMENT"
