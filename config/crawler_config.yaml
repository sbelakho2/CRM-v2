# Crawler Settings (Polite & Compliant)
crawler:
  user_agent: "Starz-Leadbot/1.0 (+support@starz-morocco.com)"
  obey_robots_txt: true
  download_delay: 2.5              # seconds between requests
  concurrent_requests_per_domain: 1
  concurrent_domains: 2
  request_timeout: 30              # seconds
  retry_times: 3
  retry_http_codes: [500, 502, 503, 504, 522, 524, 408, 429]
  
  # Rate limiting
  rate_limit_requests_per_second: 0.3  # 0.2-0.5 rps
  adaptive_backoff: true
  respect_etags: true
  cache_last_modified: true

# Contact Extraction Rules (GDPR/Privacy Compliant)
contact_extraction:
  allowed_email_types:
    - "role_based"     # purchasing@, procurement@, supplier@
    - "public_listed"  # Explicitly on contact page
  
  role_based_prefixes:
    - "purchasing"
    - "procurement"
    - "supplier"
    - "vendors"
    - "quality"
    - "sourcing"
    - "supply"
    - "sales"
    - "info"
    - "contact"
    
  exclude_personal_data:
    - true  # No personal emails unless explicitly public
    
  require_public_listing:
    - true  # Must be on public page, not behind login

# Deduplication
deduplication:
  fuzzy_match_threshold: 0.92  # Jaro-Winkler
  normalize_company_name: true
  check_against_crm: true
  merge_duplicate_features: true
  
# Output
output:
  base_path: "/var/crm/provisional/leads"
  formats: ["csv", "xlsx", "json"]
  include_fields:
    - "lead_id"
    - "company_name"
    - "legal_name"
    - "website_root"
    - "site_location"
    - "domain_country_guess"
    - "lead_url"
    - "sector_tags"
    - "fit_signals"
    - "morocco_signal"
    - "contact_emails_public"
    - "contact_form_url"
    - "supplier_portal_url"
    - "rfq_rfp_page_url"
    - "last_seen"
    - "content_last_modified"
    - "lead_score"
    - "dupe_key"
    - "enrichment_status"
    - "notes_auto"
    
# Email Notifications
notifications:
  enabled: true
  recipients:
    - "crm@starz-morocco.com"
    - "sales-ops@starz-morocco.com"
  subject: "Daily Lead Report - {date}"
  include_top_n: 10
  include_summary: true
  include_errors: true

# Compliance & Privacy
compliance:
  respect_do_not_crawl_list: true
  respect_do_not_contact_list: true
  honor_removal_requests: true
  encrypt_at_rest: true
  log_all_decisions: true
  data_retention_days: 90
  
  # GDPR/Morocco Law 09-08
  personal_data_minimization: true
  business_data_only: true
  no_login_gated_scraping: true
  
# Monitoring
monitoring:
  log_level: "INFO"
  log_path: "/var/crm/logs"
  metrics_enabled: true
  track_metrics:
    - "precision_at_top_50"
    - "approval_rate"
    - "duplicate_rate"
    - "parse_success_rate"
    - "domain_timeout_rate"
    - "average_review_time"
    - "net_new_per_week"
    
# Blacklist/Whitelist
lists:
  domain_blacklist: []  # Domains to never crawl
  domain_whitelist: []  # If set, only crawl these
  do_not_contact: []    # Companies that requested removal
  
# Quality Assurance
qa:
  random_sample_per_week: 10
  manual_audit_required: true
  track_false_positives: true
  monthly_weight_review: true
