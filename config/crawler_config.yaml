# Crawler Configuration
# Multi-region PCBA/EMS lead discovery (Morocco + US + EU + UK)
# Primary: Africa/Tunis (UTC+1) - 08:00 daily
# Regional batches: 08:30 (US-East, US-TX, UK, EU)

# Time zones for regional batches
time_zones:
  primary: Africa/Tunis        # 08:00 primary drop (Morocco focus)
  us_east: America/New_York    # 08:30 US East Coast batch
  us_central: America/Chicago  # 08:30 Texas batch
  uk: Europe/London            # 08:30 UK batch
  eu: Europe/Paris             # 08:30 EU batch

scheduler:
  primary_daily: "0 8 * * *"     # Cron format: 08:00 Africa/Tunis
  us_east_daily: "30 8 * * *"    # 08:30 America/New_York
  us_texas_daily: "30 8 * * *"   # 08:30 America/Chicago
  uk_daily: "30 8 * * *"         # 08:30 Europe/London
  eu_daily: "30 8 * * *"         # 08:30 Europe/Paris
  enabled: true

# Success Metrics (60 days)
metrics:
  precision_at_top_50: 0.75  # ≥75% approval rate
  net_new_targets_per_week: 10
  median_review_time_seconds: 45

# Scoring Thresholds
thresholds:
  recommend: 55    # Auto-recommend for review
  drop: 30         # Auto-reject (too low relevance)

# Scoring Weights (total = 130 with regional bonuses)
weights:
  geo_morocco: 20          # Morocco free zone presence
  geo_us: 16               # US East Coast + Texas metros
  geo_eu: 14               # EU core/nordics/CEE presence
  geo_uk: 12               # UK presence
  mfg_fit: 20              # PCBA/SMT/EMS manufacturing
  procurement: 18          # Procurement readiness signals
  sector_generic: 12       # Target sector alignment
  sector_dc_bonus: 4       # Data center bonus
  morocco_evidence: 15     # Evidence of Morocco sourcing
  contactability: 8        # Public contact info available
  freshness: 7             # Recent content updates
  eu_quality_stack: 10     # IATF 16949, AS9100, ISO 13485, CE
  eu_procurement_lang: 10  # Multilingual procurement markers

