# .woodpecker/audit.yaml — adversarial static gates.
#
# BRANCH PROTECTION (operator action, not expressible in-repo): configure
# the forge so `main` is protected and these pipeline statuses are required
# before merge — CI gating only bites when the forge enforces it. For this
# local Woodpecker setup: Settings → Repository → Project settings →
# Protected branches, or via the API:
#   woodpecker-cli repo update sbelakho2/CRM-v2 --protect main
# (keep untrusted fork code OFF this local runner: push/manual/tag events
# from collaborators with write access only — pull_request events from
# forks must not execute on a machine-hosted agent.)
#
# Runs on the local macOS worker (local backend, no container isolation):
#   checkout -> toolchain -> composer validation -> static analysis ->
#   destructive-migration gate -> secrets gate -> dangerous-pattern gate.
#
# SECURITY - LOCAL BACKEND, NO ISOLATION: commands run directly on the worker
# host as the agent user. `when` is restricted to push/manual/tag (trusted
# events only — write access required); never add pull_request events here.
#
# The clone step is manual (skip_clone) because plugin-git is not guaranteed
# in PATH on this worker; the workspace (CI_WORKSPACE) is created by the
# local backend before the first step.
labels:
  platform: darwin/arm64
  backend: local

when:
  - event: [push, manual, tag]

skip_clone: true

steps:
  checkout:
    image: bash
    commands:
      - |
        set -eu
        git -C "$CI_WORKSPACE" init -q
        git -C "$CI_WORKSPACE" remote add origin "$CI_REPO_CLONE_URL" || git -C "$CI_WORKSPACE" remote set-url origin "$CI_REPO_CLONE_URL"
        git -C "$CI_WORKSPACE" fetch -q --force origin "$CI_COMMIT_REF"
        git -C "$CI_WORKSPACE" checkout -q --detach "$CI_COMMIT_SHA"
        test "$(git -C "$CI_WORKSPACE" rev-parse HEAD)" = "$CI_COMMIT_SHA"
        # .env is untracked by design; composer's post-install auto-scripts
        # boot the kernel, which requires it. CI uses the committed example.
        cd "$CI_WORKSPACE"
        if [ ! -f .env ]; then cp .env.example .env; fi

  toolchain:
    image: bash
    depends_on: [checkout]
    commands:
      - |
        set -eu
        php -v | head -1
        composer --version
        php -m | grep -E '^(pdo_mysql|intl|mbstring|xml|curl)$' | sort
        # The composer platform pins PHP 8.5 — the runner must match or exceed.
        test "$(php -r 'echo PHP_VERSION_ID;')" -ge 80500  # composer platform.php = 8.5.10

  composer-validate:
    image: bash
    depends_on: [toolchain]
    commands:
      - |
        set -eu
        export PATH="/opt/homebrew/bin:$PATH"
        composer validate --strict --no-check-publish
      # composer.lock freshness is validated by `composer install` failing
      # below when the lock is out of sync with composer.json.

  composer-install:
    image: bash
    depends_on: [composer-validate]
    commands:
      - |
        set -eu
        export PATH="/opt/homebrew/bin:$PATH"
        php -d memory_limit=-1 /opt/homebrew/bin/composer install --no-interaction --no-progress --prefer-dist --no-scripts

  php-syntax:
    image: bash
    depends_on: [composer-install]
    commands:
      - |
        set -eu
        fail=0
        while IFS= read -r file; do
          php -l "$file" >/dev/null || fail=1
        done < <(find src tests migrations config public/index.php -name '*.php' -type f)
        test "$fail" -eq 0

  container-twig-lint:
    image: bash
    depends_on: [composer-install]
    commands:
      - |
        set -eu
        # .env (from .env.example) declares APP_ENV=prod; lint against the
        # dev environment explicitly — prod warmers expect live services.
        php -d memory_limit=-1 bin/console lint:container --env=dev
        php -d memory_limit=-1 bin/console lint:twig templates/ --env=dev

  migration-gate:
    image: bash
    depends_on: [checkout]
    commands:
      - php scripts/ci/check-migrations.php

  secrets-gate:
    image: bash
    depends_on: [checkout]
    commands:
      - bash scripts/ci/check-secrets.sh

  dangerous-patterns-gate:
    image: bash
    depends_on: [checkout]
    commands:
      - php scripts/ci/check-dangerous-patterns.php

  phpstan-divergence-gate:
    image: bash
    depends_on: [composer-install]
    commands:
      - |
        set -eu
        php -d memory_limit=-1 scripts/ci/check-phpstan-divergence.php

  route-authorization-gate:
    image: bash
    depends_on: [composer-install]
    commands:
      - |
        set -eu
        # Every controller must carry an explicit authorization policy
        # (#[IsGranted]) or a reviewed anonymous reason — the round-8 task
        # IDOR happened where policy was implicit.
        php scripts/ci/check-route-authorization.php

  translation-parity-gate:
    image: bash
    depends_on: [composer-install]
    commands:
      - |
        set -eu
        # en/fr/ar key sets must be IDENTICAL: Morocco/Tunisia users read
        # French and Arabic; a missing key is a raw translation key on
        # screen. The round-8 queue shipped 18 Arabic keys short.
        php scripts/ci/check-translations.php

  critical-surface-test-gate:
    image: bash
    depends_on: [composer-install]
    commands:
      - |
        set -eu
        # Every public method on a load-bearing class (pricing, duty, FX,
        # SSRF armor, archive/preservation, voters) must be NAMED by the
        # test suite — the round-8 P0 service had ZERO tests executing it
        # while CI stayed green.
        php scripts/ci/check-critical-surface-tests.php

  live-data-safety-gate:
    image: bash
    depends_on: [composer-install]
    commands:
      - |
        set -eu
        # PROJECT LAW, statically enforced: every database reference that
        # ships in CI/scripts/tests must be a throwaway *_test database as
        # crm_test; application code must be incapable of dropping a
        # database. Live data is never touched, never deleted.
        php scripts/ci/check-live-data-safety.php

  phpstan-max-gate:
    image: bash
    depends_on: [composer-install]
    commands:
      - |
        set -eu
        export PATH="/opt/homebrew/bin:$PATH"
        # MAXIMUM strictness tier: PHPStan level 10 (explicit types and
        # nullability proven everywhere) over a FROZEN baseline of legacy
        # findings (reportUnmatchedIgnoredErrors=false — fixes shrink it
        # silently). Any NEW level-10 finding fails the build. Shrink
        # phpstan-max-baseline.neon by fixing code; never grow it.
        # phpstan.neon.dist pins phpVersion 80500 = the composer platform.
        php -d memory_limit=4G vendor/bin/phpstan analyse -c phpstan-max.neon.dist --no-progress

  composer-audit:
    image: bash
    depends_on: [composer-install]
    commands:
      - |
        set -eu
        export PATH="/opt/homebrew/bin:$PATH"
        php -d memory_limit=-1 /opt/homebrew/bin/composer audit --locked --abandoned=ignore

# ── Branch protection (audit round 8, item 28) ────────────────────────
# main IS protected at the forge (enabled 2026-09-30 via the GitHub API):
#   - force pushes and deletions: BLOCKED
#   - linear history: REQUIRED
#   - required status checks: PREPARED but NOT enforced — the two Woodpecker
#     contexts (ci/woodpecker/manual/audit, ci/woodpecker/manual/tests) only
#     exist on manually-triggered pipelines because this runner is local and
#     the forge cannot deliver webhooks to it. Enforcing them now would make
#     every direct push permanently unmergeable (checks never appear).
#     Flip required_status_checks on once webhooks reach the runner and
#     pipelines fire on push.
# ── Branch protection + webhook delivery (audit round 8, items 27/28) ────
# main IS protected at the forge AND the required checks ARE enforced:
#   - required status checks: ci/woodpecker/push/audit + ci/woodpecker/push/tests
#   - force pushes and deletions: BLOCKED; linear history: REQUIRED
# Webhook delivery (the gap that previously forced manual pipelines) runs
# through a managed cloudflared quick tunnel: LaunchAgent
# com.woodpecker.tunnel (KeepAlive) forwards the forge to the local server
# and auto-repoints the GitHub webhook on every tunnel restart — quick-
# tunnel hostnames rotate. The CI agent runs under LaunchAgent
# com.woodpecker.agent (KeepAlive); the server container uses docker
# restart unless-stopped. The whole lane survives reboots. If a push lands
# without checks, the tunnel was down: `launchctl list | grep woodpecker`
# must show both agents, then push again.
