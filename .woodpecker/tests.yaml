# .woodpecker/tests.yaml — full integration test lane.
#
# Boots a THROWAWAY MySQL 8 container (fresh volume, dedicated credentials,
# database name crm_ci_test), verifies the complete migration chain on an
# empty database, checks schema/entities are in sync, then runs the whole
# PHPUnit suite. The fail-closed bootstrap guard (TestDatabaseGuard) makes
# it impossible for this lane to touch any database whose name does not end
# in "_test".
#
# SECURITY - LOCAL BACKEND: see audit.yaml. push/manual/tag only.
labels:
  platform: darwin/arm64
  backend: local

when:
  - event: [push, manual, tag]

skip_clone: true

steps:
  checkout:
    image: bash
    commands:
      - |
        set -eu
        git -C "$CI_WORKSPACE" init -q
        git -C "$CI_WORKSPACE" remote add origin "$CI_REPO_CLONE_URL" || git -C "$CI_WORKSPACE" remote set-url origin "$CI_REPO_CLONE_URL"
        git -C "$CI_WORKSPACE" fetch -q --force origin "$CI_COMMIT_REF"
        git -C "$CI_WORKSPACE" checkout -q --detach "$CI_COMMIT_SHA"
        test "$(git -C "$CI_WORKSPACE" rev-parse HEAD)" = "$CI_COMMIT_SHA"
        # .env is untracked by design; composer's post-install auto-scripts
        # boot the kernel, which requires it. CI uses the committed example.
        cd "$CI_WORKSPACE"
        if [ ! -f .env ]; then cp .env.example .env; fi

  composer-install:
    image: bash
    depends_on: [checkout]
    commands:
      - |
        set -eu
        export PATH="/opt/homebrew/bin:$PATH"
        php -d memory_limit=-1 /opt/homebrew/bin/composer install --no-interaction --no-progress --prefer-dist --no-scripts

  test-database:
    image: bash
    depends_on: [composer-install]
    environment:
      # CI steps run with a sanitized environment that does not carry the
      # user's docker context; point the CLI at the colima socket explicitly.
    commands:
      - |
        set -eu
        export PATH="/opt/homebrew/bin:$PATH"
        # Colima docker socket (machine-local runner; override DOCKER_HOST
        # in the agent environment to relocate).
        export DOCKER_HOST="${DOCKER_HOST:-unix://$HOME/.colima/default/docker.sock}"
        # Idempotent throwaway MySQL for this lane. Fresh volume every run:
        # the container is removed with its anonymous volume after tests.
        if docker rm -f crm-ci-mysql >/dev/null 2>&1; then
          echo "removed stale test container"
        fi
        docker run -d --name crm-ci-mysql --restart unless-stopped \
          -e MYSQL_ROOT_PASSWORD=ci_root_pw \
          -e MYSQL_DATABASE=crm_ci_test \
          -e MYSQL_USER=crm_test \
          -e MYSQL_PASSWORD=crm_test_pw \
          -p 3309:3306 mysql:8 >/dev/null
        for i in $(seq 1 90); do
          if docker exec crm-ci-mysql mysql -ucrm_test -pcrm_test_pw -e 'SELECT 1' >/dev/null 2>&1; then
            echo "MySQL ready (SELECT 1 as app user) after ~$((i*2))s"
            exit 0
          fi
          sleep 2
        done
        echo "MySQL failed to become ready" >&2
        exit 1

  migrations-fresh:
    image: bash
    depends_on: [test-database]
    environment:
      APP_ENV: test
      DATABASE_URL: mysql://crm_test:crm_test_pw@127.0.0.1:3309/crm_ci?charset=utf8mb4
      # .env.example declares semaphore:// for prod Linux; the macOS worker
      # must use flock.
      LOCK_DSN: flock
      # Local-backend agents inherit the worker user's global environment;
      # pin the null mail transport so no real SMTP is ever contacted.
      MAILER_DSN: null://null
    commands:
      - |
        set -eu
        # The test env appends dbname_suffix "_test" -> effective database
        # crm_ci_test. Recreate from scratch and run the ENTIRE migration
        # chain (empty database -> latest) exactly as a fresh deploy would.
        php -d memory_limit=-1 bin/console doctrine:database:drop --if-exists --force --env=test
        php -d memory_limit=-1 bin/console doctrine:database:create --env=test
        php -d memory_limit=-1 bin/console doctrine:migrations:migrate --no-interaction --env=test
        php -d memory_limit=-1 bin/console doctrine:schema:validate --env=test

  phpunit:
    image: bash
    depends_on: [migrations-fresh]
    environment:
      APP_ENV: test
      DATABASE_URL: mysql://crm_test:crm_test_pw@127.0.0.1:3309/crm_ci?charset=utf8mb4
      # .env.example declares semaphore:// for prod Linux; the macOS worker
      # must use flock.
      LOCK_DSN: flock
      # Local-backend agents inherit the worker user's global environment;
      # pin the null mail transport so no real SMTP is ever contacted.
      MAILER_DSN: null://null
    commands:
      - |
        set -eu
        # On failure, surface the application log tail (mailer and service
        # errors are caught-and-logged in controllers, invisible to phpunit).
        vendor/bin/phpunit || {
          echo '---- mailer/meeting errors ----'
          grep -niE "failed to send|ERROR|CRITICAL" var/log/test.log 2>/dev/null | tail -20 || true
          exit 1
        }

  populated-upgrade:
    image: bash
    depends_on: [phpunit]
    environment:
      APP_ENV: test
      DATABASE_URL: mysql://crm_test:crm_test_pw@127.0.0.1:3309/crm_upgrade?charset=utf8mb4
      LOCK_DSN: flock
      MAILER_DSN: null://null
    commands:
      - |
        set -eu
        export PATH="/opt/homebrew/bin:$PATH"
        export DOCKER_HOST="${DOCKER_HOST:-unix://$HOME/.colima/default/docker.sock}"
        # The MySQL container is still up (cleanup runs after this step).
        docker exec crm-ci-mysql mysql -uroot -pci_root_pw -e "GRANT ALL ON \`crm_upgrade_test\`.* TO 'crm_test'@'%'; FLUSH PRIVILEGES;" 2>/dev/null || true
        bash scripts/ci/populated-upgrade.sh

  cleanup:
    image: bash
    depends_on: [phpunit, populated-upgrade]
    failure: ignore
    environment:
    commands:
      - |
        export PATH="/opt/homebrew/bin:$PATH"
        export DOCKER_HOST="${DOCKER_HOST:-unix://$HOME/.colima/default/docker.sock}"
        docker rm -f crm-ci-mysql >/dev/null 2>&1 || true
